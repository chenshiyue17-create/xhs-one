# Spider_XHS Production Configuration
# ====================================
# This file is intended for production deployments.
# Copy this file and customize values for your environment.
# Use via: CONFIG_FILE=/app/config/production.yaml
#
# Sensitive values (secret_key, mysql_password, fernet_key) should
# be provided via environment variables rather than stored in this file.

server:
  # Backend should bind to loopback behind Nginx. Do not expose port 8000 publicly.
  host: "127.0.0.1"
  port: 8000
  cors_origins: "https://www.tengda.wang,https://tengda.wang,http://www.tengda.wang,http://tengda.wang"
  allowed_hosts: "www.tengda.wang,tengda.wang,127.0.0.1,localhost"
  expose_api_docs: false

database:
  type: "mysql"
  mysql_host: "mysql"
  mysql_port: 3306
  mysql_user: "spider_xhs"
  mysql_password: "CHANGE_ME_VIA_ENV_VAR"
  mysql_database: "spider_xhs"

security:
  # MUST be overridden via SECRET_KEY env var
  secret_key: "CHANGE_ME_VIA_ENV_VAR"
  fernet_key: ""
  # Set only for first production boot if the admin user does not exist.
  # Prefer passing BOOTSTRAP_ADMIN_PASSWORD through the server environment.
  bootstrap_admin_password: ""

scheduler:
  enabled: true
  interval_seconds: 30

frontend:
  serve_static: true
  build_dir: "./frontend/dist"
